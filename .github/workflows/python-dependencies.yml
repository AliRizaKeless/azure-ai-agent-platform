concurrency:
  group: python-deps-${{ github.ref }}
  cancel-in-progress: true

name: Python Dependency Check

on:
  workflow_dispatch:
  push:
    paths:
      - "requirements.txt"
      - "app/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/python-dependencies.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "app/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/python-dependencies.yml"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip --version
      - run: test -f requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m compileall -q app
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: timeout 120s python -m pip_audit -r requirements.txt
      - name: Confirm security audit passed
        run: echo "Security audit completed successfully"
      - run: pip list --format=columns

















