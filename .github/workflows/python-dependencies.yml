concurrency:
  group: python-deps-${{ github.ref }}
  cancel-in-progress: true

name: Python Dependency Check

on:
  workflow_dispatch:
  push:
    paths:
      - "requirements.txt"
  pull_request:
    paths:
      - "requirements.txt"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip --version
      - run: pip install -r requirements.txt
      - run: pip check






